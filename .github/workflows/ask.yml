name: Ask the README

# Anyone on GitHub can open an issue here, so treat the whole payload as hostile:
# the title is only ever passed through env (never interpolated into a shell line,
# which would be a script-injection hole), and one author is capped per day.
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: ask-readme
  cancel-in-progress: false

jobs:
  answer:
    if: startsWith(github.event.issue.title, 'ask|') && github.event.issue.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rate limit this author
        env:
          GH_TOKEN: ${{ github.token }}
          AUTHOR: ${{ github.event.issue.user.login }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          recent=$(gh issue list --repo "$GITHUB_REPOSITORY" --author "$AUTHOR" \
            --state all --limit 30 --json createdAt \
            --jq '[.[] | select((.createdAt | fromdate) > (now - 86400))] | length')
          echo "author opened $recent issue(s) in 24h"
          if [ "$recent" -gt 5 ]; then
            gh issue comment "$NUMBER" --body "That's a few questions in one day. Try again tomorrow."
            gh issue close "$NUMBER"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify sanitising still holds
        run: node scripts/ask.mjs --selftest

      - name: Answer
        id: answer
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: node scripts/ask.mjs

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          ANSWER: ${{ steps.answer.outputs.answer }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          [ -n "$ANSWER" ] || exit 0
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: answer a README question"
          git push
          gh issue comment "$NUMBER" --body "$ANSWER"
          gh issue close "$NUMBER"
